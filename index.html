<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رحلة في مختبر العلوم - القائمة الرئيسية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
    }

    /* خلفية المعمل الأساسية الحقيقية للعبة */
    .game-bg {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(rgba(15, 23, 42, 0.25), rgba(15, 23, 42, 0.45)),
                  url('https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcTMXHZpH60gq6z5afijeqol3aNny0H-XmG6dNM7sKCfLLS8rzVbzzGiuCtlv0MPSft34BaN7iYfMASbAY0') center/cover no-repeat;
    }

    /* طبقة Blur فوق خلفية المعمل */
    .blur-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1;
    }

    /* لوحة القائمة الكرتونية 3D */
    .cartoon-card {
      position: relative;
      z-index: 10;
      background: linear-gradient(180deg, #2b3a67 0%, #19223e 100%);
      border: 6px solid #4895ef;
      border-radius: 40px;
      padding: 45px 50px;
      text-align: center;
      max-width: 620px;
      width: 88%;
      box-shadow: 
        0 15px 0 #10172a,
        0 25px 40px rgba(0, 0, 0, 0.6),
        inset 0 6px 0 rgba(255, 255, 255, 0.3);
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* عنوان اللعبة الكرتوني 3D */
    .cartoon-title {
      font-size: 3.3rem;
      font-weight: 900;
      color: #ffca28;
      text-shadow: 
        3px 3px 0 #d97706,
        6px 6px 0 #b45309,
        9px 9px 0 #78350f,
        10px 10px 15px rgba(0,0,0,0.8);
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .cartoon-subtitle {
      color: #e2e8f0;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 35px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    /* زر ابدأ اللعبة المجسم */
    .btn-cartoon-start {
      background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
      color: #ffffff;
      font-size: 2rem;
      font-weight: 900;
      padding: 18px 60px;
      border: 4px solid #bbf7d0;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 
        0 10px 0 #14532d,
        0 15px 25px rgba(0, 0, 0, 0.5),
        inset 0 4px 0 rgba(255, 255, 255, 0.5);
      transition: all 0.1s ease;
      display: inline-flex;
      align-items: center;
      gap: 15px;
      text-shadow: 2px 2px 0 #14532d;
      animation: floatBtn 2s infinite ease-in-out;
    }

    .btn-cartoon-start:hover {
      transform: translateY(-4px);
      background: linear-gradient(180deg, #86efac 0%, #22c55e 100%);
    }

    .btn-cartoon-start:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #14532d;
    }

 

    /* فقاعات تفاعلية */
    .cartoon-bubble {
      position: absolute;
      bottom: -60px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(56, 189, 248, 0.4));
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: floatUp 6s infinite ease-in;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes popIn {
      0% { transform: scale(0.3) rotate(-5deg); opacity: 0; }
      80% { transform: scale(1.05) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes floatBtn {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      20% { opacity: 0.9; }
      100% { transform: translateY(-115vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="game-bg">
    <div class="blur-overlay"></div>

    <div class="top-controls">
      <button class="cartoon-icon-btn" id="soundBtn">🔊</button>
      <button class="cartoon-icon-btn">⚙️</button>
    </div>

    <div class="cartoon-card">
      <h1 class="cartoon-title">رحلة في مختبر العلوم</h1>
      <p class="cartoon-subtitle">🧪 مغامرة استكشاف الهيكل العظمي والهروب! 🧬</p>
      
      <button class="btn-cartoon-start" onclick="nextScreen()">
        <span>ابدأ اللعبة</span>
        <span>🎮</span>
      </button>
    </div>
  </div>

  <script>
    const bg = document.querySelector('.game-bg');
    for (let i = 0; i < 12; i++) {
      const bubble = document.createElement('div');
      bubble.classList.add('cartoon-bubble');
      
      const size = Math.random() * 45 + 20 + 'px';
      bubble.style.width = size;
      bubble.style.height = size;
      bubble.style.left = Math.random() * 95 + 'vw';
      bubble.style.animationDelay = Math.random() * 4 + 's';
      bubble.style.animationDuration = Math.random() * 4 + 5 + 's';
      
      bg.appendChild(bubble);
    }

    function nextScreen() {
     window.location.href = "character.html.html";
    }

    let isMuted = false;
    document.getElementById('soundBtn').addEventListener('click', function() {
      isMuted = !isMuted;
      this.textContent = isMuted ? '🔈' : '🔊';
    });
  </script>

</body>
</html>
